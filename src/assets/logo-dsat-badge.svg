<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="64" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">DSAT Advantage logo (sidebar)</title>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07102a" />
      <stop offset="1" stop-color="#062544" />
    </linearGradient>
  </defs>

  <!-- rounded pill background to match sidebar mark -->
  <rect x="0" y="0" width="240" height="64" rx="12" fill="url(#lg)" />

  <!-- Icon: small monitor with lines (left) -->
  <g transform="translate(12,10)">
    <rect x="0" y="0" width="44" height="34" rx="6" fill="#0A4CFF" opacity="0.95" />
    <rect x="4" y="6" width="36" height="6" rx="2" fill="#ffffff" opacity="0.98" />
    <rect x="4" y="16" width="24" height="6" rx="2" fill="#ffffff" opacity="0.7" />
    <rect x="18" y="28" width="8" height="4" rx="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Wordmark: DSAT / ADVANTAGE stacked to the right -->
  <g transform="translate(68,8)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial">
    <text x="0" y="26" font-size="24" font-weight="700" fill="#FFFFFF">DSAT</text>
    <text x="0" y="46" font-size="11" font-weight="600" fill="#8fb4ff">ADVANTAGE</text>
  </g>
</svg>